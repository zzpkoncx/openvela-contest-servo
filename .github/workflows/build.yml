name: Build openvela servo firmware (esp32s3-eye:nsh)

# 触发: 推到 main 自动编译; 也支持手动 workflow_dispatch。
# 编译机 = GitHub 官方 ubuntu-22.04 (真实 Ubuntu 22.04, 符合 openvela 官方要求)。
# 产物: 固件打进 release 'latest' (fw.zip) + 完整 build.log, 均为公开可下载
#        (仓库设为 public 后, release 资产无需鉴权即可下载, 方便 Windows 侧拉取烧录)。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 创建/更新 release 并上传资产

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout contest code
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git git-lfs python3 python3-pip python3-venv \
            build-essential gcc g++ make automake libtool pkg-config \
            libncurses-dev flex bison gperf libssl-dev libffi-dev \
            wget curl xz-utils unzip ccache ca-certificates
          sudo git lfs install
          # 安装 repo 工具 (清华镜像, 避免连 Google gerrit 超时)
          sudo curl -fsSL -o /usr/local/bin/repo https://mirrors.tuna.tsinghua.edu.cn/git/git-repo
          sudo chmod +x /usr/local/bin/repo
          repo --version

      - name: Disable systemd-oomd (runner RAM < 16GB, 否则 repo sync 会被 OOM 杀)
        run: |
          sudo systemctl stop systemd-oomd systemd-oomd.socket || true

      - name: repo init + sync openvela (dev-ai-contest-2026)
        # 注意: 必须先 mkdir 再 cd, 不能把 working-directory 设成尚不存在的 ../ov
        #       (GitHub 会在启动 shell 前解析 working-directory, 目录不存在会直接报错)。
        run: |
          mkdir -p "${{ github.workspace }}/../ov"
          cd "${{ github.workspace }}/../ov"
          repo init --partial-clone \
            -u https://github.com/open-vela/manifests.git \
            -b dev-ai-contest-2026 -m openvela.xml --git-lfs \
            --repo-url=https://mirrors.tuna.tsinghua.edu.cn/git/git-repo
          repo sync -c -j8 2>&1 | tail -n 200

      - name: Apply contest code + build (esp32s3-eye nsh + servo GPIO42)
        # 同样先 cd 进已存在的 ov 目录, 再执行脚本
        run: |
          cd "${{ github.workspace }}/../ov"
          bash "${{ github.workspace }}/tools/apply_and_build.sh" "${{ github.workspace }}" 2>&1 | tee /tmp/build.log

      - name: Package firmware
        id: pkg
        run: |
          OUT=$(ls -d "${{ github.workspace }}"/../ov/cmake_out/*/ 2>/dev/null | head -1)
          echo "OUT=$OUT" >> "$GITHUB_OUTPUT"
          if [ -n "$OUT" ]; then
            ( cd "$OUT" && zip -r /tmp/fw.zip . )
            echo "== 产物目录内容 ==" | tee -a /tmp/build.log
            ls -la "$OUT" | tee -a /tmp/build.log
          else
            echo "NO BUILD OUTPUT (cmake_out 为空, 编译可能失败)" | tee -a /tmp/build.log
          fi

      - name: Upload firmware + build log (release 'latest', 公开)
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: latest
          name: openvela servo firmware (latest)
          files: |
            /tmp/fw.zip
            /tmp/build.log
          fail_on_unmatched_files: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
